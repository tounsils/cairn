<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn — can you place Timbuktu?</title>
<meta name="description" content="Drop a pin where you think it is. Then find out whether your family can do better.">
<meta name="theme-color" content="#05070D">
<meta property="og:title" content="Cairn — can you place Timbuktu?">
<meta property="og:description" content="Drop a pin. Then send it to your people and see who gets closest.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
/* Night earth, same system as the about page: amber is people, cyan is data,
   and the ground competes with neither. */
:root {
  --void:#05070D; --panel:rgba(13,20,36,.80); --edge:rgba(255,255,255,.10);
  --edge-lit:rgba(255,255,255,.18); --text:#EDF2FC; --muted:#8B9AB4; --faint:#5A6884;
  --amber:#FFB25C; --amber-hot:#FF8A3D; --cyan:#5BE1D6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;z-index:0}
.maplibregl-ctrl-attrib{font-size:10px!important;background:rgba(5,7,13,.72)!important}
.maplibregl-ctrl-attrib a{color:var(--faint)!important}

.topbar{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:max(.9rem,env(safe-area-inset-top)) 1rem .9rem;background:linear-gradient(180deg,rgba(5,7,13,.92),transparent);pointer-events:none}
.mark{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.09em}
.mark svg{width:.95rem;height:1.1rem;flex:0 0 auto}
.topbar a{pointer-events:auto;color:var(--faint);font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.topbar a:hover{color:var(--cyan)}

.sheet{position:fixed;z-index:4;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border-top:1px solid var(--edge);padding:1.1rem 1rem max(1.1rem,env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px rgba(0,0,0,.9)}
.inner{width:min(40rem,100%);margin-inline:auto}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:0 0 .5rem}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0 0 .35rem;line-height:1.02;font-size:clamp(1.9rem,1.3rem+2.6vw,2.9rem)}
.sub{color:var(--muted);font-size:.9375rem;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;font-family:var(--body);font-weight:700;font-size:1rem;padding:.95rem 1.4rem;border:1px solid transparent;border-radius:100px;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s,opacity .2s}
.btn-primary{background:linear-gradient(100deg,var(--amber),var(--amber-hot));color:#1A0E04;box-shadow:0 8px 26px -10px rgba(255,138,61,.7)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px)}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.readout{display:flex;align-items:baseline;gap:.6rem;margin:.1rem 0 .3rem}
.readout b{font-family:var(--display);font-size:clamp(2.2rem,1.4rem+3.4vw,3.2rem);font-weight:800;color:var(--cyan);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.readout span{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dirn{font-size:1.4rem;color:var(--amber);line-height:1}

.board{margin:.85rem 0 0;display:grid;gap:.35rem;max-height:30vh;overflow-y:auto}
.row{display:grid;grid-template-columns:1.5rem 1fr auto;align-items:center;gap:.65rem;padding:.35rem .2rem}
.av{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.56rem;color:#100A03;background:linear-gradient(140deg,var(--amber),var(--amber-hot))}
.row.me .av{background:linear-gradient(140deg,var(--cyan),#3aa89f)}
.who{min-width:0;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who i{font-style:normal;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-left:.4rem}
.dist{font-family:var(--mono);font-size:.875rem;font-variant-numeric:tabular-nums}

.field{display:block;margin:.85rem 0 .55rem}
input[type=text]{width:100%;font:inherit;font-size:1rem;color:var(--text);background:rgba(0,0,0,.34);border:1px solid var(--edge);padding:.8rem .9rem;border-radius:12px}
input::placeholder{color:var(--faint)}
input:focus{outline:none;border-color:var(--amber)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.note{font-family:var(--mono);font-size:.66rem;line-height:1.6;color:var(--faint);margin:.7rem 0 0}
.link{display:flex;gap:.5rem;margin-top:.6rem}
.link input{flex:1;font-family:var(--mono);font-size:.78rem}
.link .btn{flex:0 0 auto;width:auto;padding:.8rem 1.15rem;font-size:.875rem}
.err{color:var(--amber-hot);font-size:.875rem;margin:.6rem 0 0;min-height:1.2rem}
.hide{display:none!important}

.pin{width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid rgba(255,138,61,.4);box-shadow:0 0 0 4px rgba(255,138,61,.12);cursor:grab}
.pin.answer{background:var(--cyan);border-color:rgba(91,225,214,.4);box-shadow:0 0 0 6px rgba(91,225,214,.14);cursor:default}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="World map. Tap to place your guess."></div>

<header class="topbar">
  <div class="mark">
    <svg viewBox="0 0 24 28" aria-hidden="true">
      <ellipse cx="12" cy="24.2" rx="9" ry="2.9" fill="#FFB25C" opacity=".95"/>
      <ellipse cx="12" cy="18.4" rx="6.8" ry="2.5" fill="#FFB25C" opacity=".78"/>
      <ellipse cx="12" cy="13.2" rx="5" ry="2.1" fill="#FFB25C" opacity=".60"/>
      <ellipse cx="12" cy="8.8" rx="3.4" ry="1.7" fill="#FFB25C" opacity=".42"/>
      <ellipse cx="12" cy="5.2" rx="2" ry="1.2" fill="#5BE1D6" opacity=".85"/>
    </svg>
    <span>CAIRN</span>
  </div>
  <a href="about.html">What is this?</a>
</header>

<section class="sheet">
  <div class="inner">

    <div id="stepGuess">
      <p class="eyebrow" id="guessEyebrow">Today&rsquo;s place</p>
      <h1 id="prompt">Timbuktu</h1>
      <p class="sub" id="guessHint">Tap the map to drop a pin where you think it is.</p>
      <button class="btn btn-primary" id="lockIn" disabled style="margin-top:.9rem">Drop a pin first</button>
      <div class="trap" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" tabindex="-1" autocomplete="off">
      </div>
    </div>

    <div id="stepResult" class="hide">
      <p class="eyebrow">You were</p>
      <div class="readout"><b id="dist">0</b><span>miles off</span><span class="dirn" id="dirn"></span></div>
      <p class="sub" id="reveal"></p>

      <div id="crewBlock">
        <label class="field" for="player">
          <input type="text" id="player" maxlength="24" autocomplete="off" placeholder="Your name, so your crew knows who guessed">
        </label>
        <button class="btn btn-primary" id="makeCrew">Now make your family try it &rarr;</button>
        <p class="note" id="crewNote">They get the same place. You&rsquo;ll see who got closest.</p>
      </div>

      <div id="linkBlock" class="hide">
        <p class="sub">Send this to your crew:</p>
        <div class="link">
          <input type="text" id="crewLink" readonly aria-label="Your crew link">
          <button class="btn btn-primary" id="copyLink">Send</button>
        </div>
        <p class="note">Anyone who opens it guesses the same place, then lands on your board.</p>
      </div>

      <div id="board" class="board"></div>
      <p class="err" id="err" role="status" aria-live="polite"></p>
    </div>

  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";

const API = "https://cairn-signup.tounsils.workers.dev";
const params = new URLSearchParams(location.search);
const CREW_ID = params.get("c");
const SRC = params.get("src") || (CREW_ID ? "crew-link" : "direct");
const openedAt = Date.now();

const $ = (id) => document.getElementById(id);
const show = (el, on) => el.classList.toggle("hide", !on);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let guess = null, guessMarker = null, playId = null, myCrew = CREW_ID;

/* --- map ------------------------------------------------------------------ */
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: { world: { type: "vector", url: "https://demotiles.maplibre.org/tiles/tiles.json" } },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#05070D" } },
      { id: "land", type: "fill", source: "world", "source-layer": "countries",
        paint: { "fill-color": "#0E1730", "fill-opacity": 0.92 } },
      { id: "coast", type: "line", source: "world", "source-layer": "countries",
        paint: { "line-color": "#27375C", "line-width": 0.7 } },
    ],
  },
  center: [10, 22], zoom: 1.3, attributionControl: { compact: true },
  // No place labels, deliberately: labelling the countries would hand over
  // the answer before the guess.
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

map.on("click", (e) => {
  if (playId) return; // guessing is over once it is locked in
  guess = { lng: e.lngLat.lng, lat: e.lngLat.lat };
  if (!guessMarker) {
    const el = document.createElement("div");
    el.className = "pin";
    guessMarker = new maplibregl.Marker({ element: el, draggable: true })
      .setLngLat(e.lngLat).addTo(map);
    guessMarker.on("dragend", () => {
      const p = guessMarker.getLngLat();
      guess = { lng: p.lng, lat: p.lat };
    });
  } else {
    guessMarker.setLngLat(e.lngLat);
  }
  $("lockIn").disabled = false;
  $("lockIn").textContent = "Lock in my guess";
});

/* --- arriving on somebody's crew link -------------------------------------- */
(async function crewContext() {
  if (!CREW_ID) return;
  try {
    const r = await (await fetch(`${API}/crew/${encodeURIComponent(CREW_ID)}`)).json();
    if (!r.ok || !r.plays.length) return;
    const best = r.plays[0];
    $("guessEyebrow").textContent = `${best.player} challenged you`;
    $("guessHint").textContent =
      `${best.player} was ${best.distanceMi.toLocaleString()} miles off. Tap the map to place your pin.`;
  } catch {
    // The round still works without the challenge line.
  }
})();

/* --- play ------------------------------------------------------------------ */
$("lockIn").addEventListener("click", async () => {
  if (!guess) return;
  $("lockIn").disabled = true;
  $("lockIn").textContent = "Checking…";
  try {
    const res = await fetch(`${API}/play`, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        lng: guess.lng, lat: guess.lat,
        crewId: CREW_ID || undefined, src: SRC,
        website: $("website").value, elapsedMs: Date.now() - openedAt,
      }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "could not score that guess");
    playId = data.playId;
    renderResult(data);
  } catch (err) {
    $("lockIn").disabled = false;
    $("lockIn").textContent = "Try again";
    $("err").textContent = err.message;
  }
});

function renderResult({ result, answer }) {
  show($("stepGuess"), false);
  show($("stepResult"), true);
  $("dist").textContent = result.distanceMi.toLocaleString();
  $("dirn").textContent = result.arrow;
  $("reveal").textContent = `${answer.reveal} You were ${result.band}.`;

  const el = document.createElement("div");
  el.className = "pin answer";
  new maplibregl.Marker({ element: el }).setLngLat([answer.lng, answer.lat]).addTo(map);
  if (guessMarker) guessMarker.setDraggable(false);

  map.addSource("line", {
    type: "geojson",
    data: { type: "Feature", geometry: { type: "LineString",
      coordinates: [[guess.lng, guess.lat], [answer.lng, answer.lat]] } },
  });
  map.addLayer({ id: "line", type: "line", source: "line",
    paint: { "line-color": "#5BE1D6", "line-width": 1.6, "line-opacity": 0.6, "line-dasharray": [2, 2] } });

  map.fitBounds(
    [[Math.min(guess.lng, answer.lng), Math.min(guess.lat, answer.lat)],
     [Math.max(guess.lng, answer.lng), Math.max(guess.lat, answer.lat)]],
    { padding: { top: 90, bottom: 300, left: 50, right: 50 }, duration: 1200 },
  );

  // Somebody arriving on a crew link is joining a board, not starting one.
  if (myCrew) {
    $("makeCrew").textContent = "Put me on the board →";
    $("crewNote").textContent = "Your guess joins theirs.";
  }
  loadBoard();
}

/* --- the conversion this whole test watches for ---------------------------- */
$("makeCrew").addEventListener("click", async () => {
  const btn = $("makeCrew");
  btn.disabled = true;
  btn.textContent = "One moment…";
  try {
    const res = await fetch(`${API}/finish`, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ playId, player: $("player").value, createCrew: !myCrew, src: SRC }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "could not do that");
    myCrew = data.crewId || myCrew;
    show($("crewBlock"), false);
    if (myCrew && !CREW_ID) {
      $("crewLink").value = `${location.origin}${location.pathname}?c=${myCrew}`;
      show($("linkBlock"), true);
    }
    loadBoard();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Try again";
    $("err").textContent = err.message;
  }
});

$("copyLink").addEventListener("click", async () => {
  const url = $("crewLink").value;
  try {
    // The native share sheet on a phone, which is where this actually gets sent from.
    if (navigator.share) {
      await navigator.share({ title: "Cairn", text: "Can you place Timbuktu?", url });
    } else {
      await navigator.clipboard.writeText(url);
      $("copyLink").textContent = "Copied";
    }
  } catch {
    $("crewLink").select();
  }
});

async function loadBoard() {
  if (!myCrew) return;
  try {
    const r = await (await fetch(`${API}/crew/${encodeURIComponent(myCrew)}`)).json();
    if (!r.ok) return;
    $("board").innerHTML = r.plays.map((p, i) => `
      <div class="row${p.id === playId ? " me" : ""}">
        <span class="av">${esc((p.player || "S").slice(0, 2).toUpperCase())}</span>
        <span class="who">${esc(p.player)}${i === 0 && r.plays.length > 1 ? "<i>closest</i>" : ""}</span>
        <span class="dist">${p.distanceMi.toLocaleString()} mi</span>
      </div>`).join("");
  } catch {
    // The board is a nicety. The round already happened.
  }
}
</script>
</body>
</html>
