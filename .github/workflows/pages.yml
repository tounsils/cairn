name: Deploy landing page

# Publishes site/ to GitHub Pages. The repo keeps its docs/ folder for project
# documentation, so Pages is fed from a workflow rather than from a branch
# folder, which would force the site to live in docs/ and collide with it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published
# landing page is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against shipping a page that measures nothing
        run: |
          # The game is useless without an API to score against, and a broken
          # constant would still render a perfectly convincing map.
          if ! grep -qE 'const API = "https://[^"]+";' site/index.html; then
            echo "::error::site/index.html has no valid https API endpoint."
            exit 1
          fi
          echo "API endpoint configured."

      - name: Guard against leaking the answer into the page
        run: |
          # The coordinates live on the server and are returned only after a
          # guess is committed. If they ever appear in the client, anyone can
          # read the answer from devtools and every crew board becomes
          # meaningless. `npm run lint` checks this too; this is the copy that
          # cannot be skipped by forgetting to run it.
          if grep -qE '3\.0026|16\.7666' site/*.html; then
            echo "::error::Round coordinates found in page source. The answer must stay server-side."
            exit 1
          fi
          echo "Answer is not in the client."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
